[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecu-release-gate"
version = "0.1.0"
description = "Aggregate firmware release evidence into one deterministic CI gate."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mysteryljn"}]
dependencies = []

[project.scripts]
ecu-release-gate = "ecu_release_gate.cli:main"

[project.urls]
Repository = "https://github.com/mysteryljn/ecu-release-gate"
Issues = "https://github.com/mysteryljn/ecu-release-gate/issues"

[tool.setuptools.packages.find]
include = ["ecu_release_gate*"]

[tool.setuptools.package-data]
ecu_release_gate = ["fixtures/*"]
